# Mỗi lần push hoặc mở Pull Request có sửa lifequest-android/: chạy unit test, lint và build APK debug.
# Xem kết quả ở tab "Actions" trên GitHub.
name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "lifequest-android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "lifequest-android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifequest-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Cache thư viện Gradle giữa các lần chạy để build nhanh hơn
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lifequest-debug-apk
          path: lifequest-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: lifequest-android/app/build/reports/
